name: Keep Supabase project alive

# Supabase free-tier projects auto-pause after 7 days with no database
# activity. This just makes one lightweight read every few days so the
# project (and this site's Projects/Skills data) never goes to sleep.
#
# One-time setup: in this repo's Settings -> Secrets and variables ->
# Actions, add two repository secrets:
#   SUPABASE_URL       (your Project URL, e.g. https://xxxx.supabase.co)
#   SUPABASE_ANON_KEY  (your anon/public key -- same one used in
#                        assets/js/supabase-client.js)

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS -f \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1"
